<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Vivi Variedades</title>
    <meta name="theme-color" content="#0f766e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vivi Variedades">
    <link rel="manifest" href="./manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"></noscript>
    <!-- Estilos críticos inline para evitar tela branca -->
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        #loadingScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f766e;
            display: flex; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .loading-content { text-align: center; color: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .loading-logo { font-size: 72px; margin-bottom: 20px; }
        .spinner { width: 60px; height: 60px; margin: 0 auto 20px; border: 5px solid rgba(255,255,255,0.2); border-top: 5px solid white; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <link rel="stylesheet" href="shell.min.css?v=2.3.1">
    <script>
        // Controle de versão
        const CURRENT_VERSION = '2.3.1';
        localStorage.setItem('appVersion', CURRENT_VERSION);

        // Theme: apply saved preference or system preference immediately to avoid flash
        (function() {
            const saved = localStorage.getItem('theme');
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body class="loading">
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-logo">🛒</div>
            <h1 class="loading-title">Vivi Variedades</h1>
            <p class="loading-subtitle">Controle de vendas</p>
            <div class="spinner"></div>
            <p>Carregando...</p>
        </div>
    </div>

    <!-- Tela de Login -->
    <div id="loginScreen" class="login-screen" style="display: none;">
        <div class="login-container">
            <div class="login-header">
                <div class="login-logo">🛒</div>
                <h1>Vivi Variedades</h1>
                <p>Sistema de controle de vendas fiadas</p>
                <span class="login-version" id="loginVersion"></span>
            </div>

            <div id="emailTab" class="tab-content active">
                <form id="loginForm">
                    <input type="email" id="loginEmail" placeholder="Email" required>
                    <div class="password-wrapper">
                        <input type="password" id="loginPassword" placeholder="Senha" required>
                        <button type="button" id="togglePassword" class="btn-toggle-password" aria-label="Mostrar senha" title="Mostrar/Ocultar senha">
                            <span class="eye-icon">👁️</span>
                        </button>
                    </div>
                    <button type="submit" class="btn btn-primary">Entrar</button>
                </form>
            </div>
        </div>
    </div>

    <div id="dashboardMount" hidden></div>


    <script type="module" src="auth-bootstrap.min.js?v=2.3.1"></script>
</body>
</html>
